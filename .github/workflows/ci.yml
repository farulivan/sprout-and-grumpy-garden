# Checks every pull request, and main after each merge. Cloudflare builds the site by itself (see "On
# Cloudflare" in the README), but its build runs neither the tests nor the type checks: this does.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The token can read the code and nothing else.
permissions:
  contents: read

# A new push to a pull request makes its older run pointless, so that run is stopped. On main every merge
# is checked to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # The rule on main requires a check of this name to pass before a pull request can be merged.
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Each action is pinned to a commit, as the repository's Actions policy requires: a tag can be moved
      # to other code, a commit can't. Dependabot keeps the pins and their comments up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Corepack fetches the pnpm that package.json pins, the same way Cloudflare's build does.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  dependency-review:
    # Fails a pull request that adds or upgrades a dependency with a known vulnerability of moderate
    # severity or worse. It compares the lockfile on both sides through GitHub's API, so it needs no checkout.
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
