# Releases. On every merge to main, release-please keeps one pull request open for the next release: the version it
# works out from the commit messages since the last one (fix: a patch, feat: a minor, feat!: or Release-As: a major),
# that version in package.json, and its entry in CHANGELOG.md. Merging that pull request is the release: release-please
# tags it vX.Y.Z and publishes a GitHub Release, and Cloudflare puts that merge online (scripts/deploy.sh). See
# "Versions" in the README.
name: Release

on:
  push:
    branches: [main]

# The workflow's own token can only read. release-please works with RELEASE_PLEASE_TOKEN instead: a pull request opened
# with the workflow's token would never run the checks main requires, and this repository doesn't let Actions open
# pull requests anyway. That token is a fine-grained one for this repository only, with Contents and Pull requests.
# Keep this job to the one pinned action: nothing from the repository runs here, so nothing can read the token.
permissions:
  contents: read

# Releases happen one at a time, and each runs to the end.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
    steps:
      - name: Wait for the token
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::There is no RELEASE_PLEASE_TOKEN secret yet, so no release pull request. See Versions in the README."
      # Pinned to a commit, as the repository's Actions policy requires; Dependabot keeps the pin up to date.
      - id: release
        if: env.HAS_TOKEN == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - name: Say what was released
        if: steps.release.outputs.release_created == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: echo "::notice::Released $TAG. Cloudflare is putting it online."
